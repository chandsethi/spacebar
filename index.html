<!doctype html>
<!--
  Spacebar: a local work planner for product managers. One HTML file, no server.

  WHERE DATA LIVES
  - Always in this browser (localStorage key "spacebar.data.v1").
  - Optionally in a linked JSON file (Settings > Data and Claude > Create data file).
    The page writes every change to that file and reloads within about 2 seconds
    when the file changes on disk. That is how Claude (or any tool) can edit your
    workspace: edit the JSON file, not this HTML.

  DATA MODEL (also written into the JSON file as "_readme")
  settings    { name, priorityCap, dailyCap, objectiveCap, cycleDays, cycleStart: "YYYY-MM-DD", theme }
  stages      [{ id, name, hint }]                     board columns, in order
  modes       [{ id, name, hint }]                     the kind of energy a task needs
  objectives  [{ id, title, status: on|risk|off }]     goals for the current cycle (the Weekly plan)
  initiatives [{ id, name, stage, priority, link, milestones: [{ id, date, label, done }] }]
  tasks       [{ id, title, ini, mode, obj, link, done, doneAt }]   next steps; ini = initiative id
  daily       [taskId, ...]                            the Daily plan (closed list), in order, at most settings.dailyCap
  notes       "..."                                    the Scratchpad, plain text
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F0; --panel:#F8F8F6; --card:#FFFFFF; --raise:#FFFFFF; --hover:#ECECE9;
  --ink:#202327; --ink2:#4A4E55; --mute:#7D8087; --faint:#AEB0B5; --line:#E4E3E0; --line2:#D6D5D1;
  --ring:#8C9098; --btn:#2A2D32; --btn-ink:#FFFFFF;
  --on:#8AAE93; --risk:#CFAF6B; --off:#C7948C;
  --sh1:0 1px 2px rgba(28,30,34,.05);
  --sh2:0 6px 20px rgba(28,30,34,.08),0 1px 3px rgba(28,30,34,.05);
  --sh3:0 24px 64px rgba(28,30,34,.16),0 6px 16px rgba(28,30,34,.07);
  --scrim:rgba(242,242,240,.38); --toast:#2A2D32; --tip:#2A2D32;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151618; --panel:#1A1B1E; --card:#222428; --raise:#25272B; --hover:#2B2D32;
    --ink:#E9EAEC; --ink2:#C4C6CB; --mute:#92959C; --faint:#5F6269; --line:#2C2E33; --line2:#3A3C42;
    --ring:#8C9098; --btn:#E9EAEC; --btn-ink:#151618;
    --on:#7FA58A; --risk:#C4A666; --off:#BF8C85;
    --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 6px 18px rgba(0,0,0,.4); --sh3:0 24px 64px rgba(0,0,0,.6);
    --scrim:rgba(14,15,17,.42); --toast:#3A3C42; --tip:#3A3C42; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151618; --panel:#1A1B1E; --card:#222428; --raise:#25272B; --hover:#2B2D32;
  --ink:#E9EAEC; --ink2:#C4C6CB; --mute:#92959C; --faint:#5F6269; --line:#2C2E33; --line2:#3A3C42;
  --ring:#8C9098; --btn:#E9EAEC; --btn-ink:#151618;
  --on:#7FA58A; --risk:#C4A666; --off:#BF8C85;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 6px 18px rgba(0,0,0,.4); --sh3:0 24px 64px rgba(0,0,0,.6);
  --scrim:rgba(14,15,17,.42); --toast:#3A3C42; --tip:#3A3C42; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{display:inline-block;min-width:18px;padding:2px 5px;border-radius:5px;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;color:var(--mute);font:600 11px/1.2 var(--font);text-align:center}

#app{height:100vh;display:grid;grid-template-rows:52px minmax(0,1fr)}

/* Top bar */
.topbar{display:flex;align-items:center;gap:4px;padding:0 12px 0 22px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow:hidden}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.tb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:9px;width:min(300px,28vw);margin-left:24px;color:var(--faint);cursor:text}
.tb-search:hover{background:var(--bg)}
.tb-search:focus-within{background:var(--card);box-shadow:0 0 0 1px var(--line2);color:var(--mute)}
.tb-search:focus-within kbd{visibility:hidden}
.tb-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13.5px}
.tb-search input::placeholder{color:var(--faint)}
.tb-search input::-webkit-search-cancel-button{display:none}
.tb-sp{flex:1}
.tb-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 12px;border-radius:9px;color:var(--ink2);font-size:13px;font-weight:600;white-space:nowrap}
.tb-btn:hover,.tb-btn.on{background:var(--hover)}
.tb-warn{display:flex;align-items:center;height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--hover);white-space:nowrap}
.tb-warn[hidden]{display:none}
.icb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mute);flex:none}
.icb:hover{background:var(--bg);color:var(--ink)}
.icb.on{color:var(--ink);background:var(--hover)}
.icb.on .i{fill:currentColor}

/* Hover toolbars and icon buttons */
.tools{position:absolute;top:5px;right:5px;display:flex;align-items:center;gap:1px;padding-left:18px;background:linear-gradient(90deg,transparent,var(--tb,var(--card)) 16px);opacity:0;pointer-events:none;transition:opacity .12s}
.ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--mute);flex:none}
.ic.sm{width:24px;height:24px}
.ic:hover{background:var(--hover);color:var(--ink)}
.ic.on{color:var(--ink)}
.ic.on .dt{fill:currentColor}
.hov{opacity:0;transition:opacity .12s}
@media (hover:none){.tools,.hov{opacity:1;pointer-events:auto}}

/* Tooltip */
.tip{position:fixed;z-index:400;max-width:280px;padding:5px 8px;border-radius:7px;background:var(--tip);color:#F1F2F4;font-size:12px;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .1s,transform .1s}
.tip.on{opacity:1;transform:none}

/* Board */
.board{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.note-line{display:flex;align-items:center;gap:16px;margin:14px 70px 0 24px;font-size:13px;color:var(--mute)}
.note-line button{font-weight:600;color:var(--ink)}
.note-line button.q{color:var(--mute);font-weight:500}
.note-line button:hover{text-decoration:underline}
.cols{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:22px;padding:18px 66px 0 24px;overflow-x:auto;overflow-y:hidden}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;padding:0 2px 12px;min-height:38px}
.col-name{font-size:16px;font-weight:700;letter-spacing:-.015em}
.col-count{font-size:12.5px;color:var(--faint);font-weight:600}
.col-head .ic{margin-left:auto}
.col-body{flex:1;min-height:80px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding:2px 2px 28px;margin:0 -2px;scrollbar-width:thin}
.empty-add{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:11px;border:1px dashed var(--line2);color:var(--mute);font-size:13px;font-weight:500;flex:none}
.empty-add:hover{color:var(--ink);background:var(--panel)}

/* Initiative */
.ini{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;flex:none;--tb:var(--bg)}
.ini.prio{background:var(--card);box-shadow:var(--sh1);--tb:var(--card)}
.ini.folded{padding-bottom:9px}
body.kbd .ini.sel{box-shadow:0 0 0 1.5px var(--ring)}
.ini-top{cursor:grab;user-select:none;-webkit-user-select:none}
.ini-head{display:flex;align-items:flex-start;gap:4px;cursor:pointer;border-radius:8px;padding:2px 0 2px 2px}
.ini-head:hover .hov,body.kbd .ini.sel .ini-head .hov{opacity:1}
.chev{width:18px;height:20px;display:grid;place-items:center;color:var(--faint);flex:none}
.chev .i{width:13px;height:13px;transition:transform .18s}
.ini:not(.folded) .ini-head .chev .i,.obj.open .obj-row .chev .i{transform:rotate(90deg)}
.ini-head:hover .chev,.obj-row:hover .chev{color:var(--ink2)}
.ini-name{flex:1;min-width:0;font-weight:650;font-size:14px;letter-spacing:-.005em;line-height:1.4;padding:0 2px;border-radius:4px;outline:none;word-break:break-word}
.pstar{color:var(--ink2);margin-top:3px;flex:none}
.pstar .i{width:13px;height:13px;fill:currentColor}
.ini-acts{display:flex;align-items:center;gap:0;margin:-2px -2px 0 0;flex:none}
.ini-date{display:flex;gap:6px;max-width:100%;margin:1px 0 0 24px;font-size:12.5px;color:var(--mute);text-align:left;min-width:0}
.ini-date b{font-weight:600;color:var(--ink2);white-space:nowrap}
.ini-date span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ini-date:hover span{text-decoration:underline}
.fold-info{display:flex;align-items:center;margin:4px 0 0 24px;font-size:12.5px;color:var(--mute)}
.fold-info:hover{color:var(--ink)}
.tasks{display:flex;flex-direction:column;gap:6px;min-height:4px;margin-top:8px}
.done-list{margin-top:6px;padding-top:4px;border-top:1px solid var(--line)}
.dn{display:flex;align-items:flex-start;gap:9px;padding:5px 4px;font-size:12.5px;color:var(--mute)}
.dn .check{width:15px;height:15px}
.dn span{text-decoration:line-through;flex:1;min-width:0}

/* Task */
.task{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:grab;user-select:none;-webkit-user-select:none;--tb:var(--card)}
.task:hover{border-color:var(--line2)}
.task:hover>.tools,body.kbd .task.sel>.tools{opacity:1;pointer-events:auto}
body.kbd .task.sel{box-shadow:0 0 0 1.5px var(--ring);border-color:transparent}
.check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:1.5px;color:transparent;background:var(--card);transition:background .15s,border-color .15s,color .15s}
.check .i{width:10px;height:10px;stroke-width:2.8}
.check:hover{border-color:var(--on);color:var(--on)}
.check.on,.completing .check{background:var(--on);border-color:var(--on);color:#fff}
.t-body{flex:1;min-width:0}
.t-title{font-size:13.5px;line-height:1.4;outline:none;border-radius:4px;cursor:text;word-break:break-word;min-height:19px}
.t-meta{display:flex;gap:12px;margin-top:2px}
.tok{font-size:12px;color:var(--mute);border-radius:4px}
.tok:hover{color:var(--ink)}
.marks{position:absolute;top:8px;right:8px;display:flex;gap:2px;transition:opacity .12s}
.mk{width:20px;height:20px;display:grid;place-items:center;color:var(--faint);border-radius:6px}
.mk .i{width:13px;height:13px}
.mk .dt{fill:currentColor}
button.mk:hover{color:var(--ink);background:var(--hover)}
.task:hover>.marks,body.kbd .task.sel>.marks{opacity:0}
.task.m1 .t-title{padding-right:20px}
.task.m2 .t-title{padding-right:42px}
.completing{opacity:.55;transition:opacity .3s}
.completing .t-title{text-decoration:line-through;color:var(--mute)}
[data-edit]:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.editing{user-select:text!important;-webkit-user-select:text!important;background:var(--card);box-shadow:0 0 0 1px var(--card),0 0 0 2.5px var(--ring);cursor:text!important}

/* Planner: Daily and Weekly cards */
.scrim{position:fixed;inset:0;z-index:35;background:var(--scrim);backdrop-filter:blur(6px) saturate(.85);-webkit-backdrop-filter:blur(6px) saturate(.85);opacity:0;pointer-events:none;transition:opacity .28s ease}
.scrim.on{opacity:1;pointer-events:auto}
.deck{position:fixed;top:62px;bottom:14px;right:18px;width:420px;z-index:40;pointer-events:none}
.dcard{position:absolute;left:0;right:0;top:76px;bottom:0;background:var(--raise);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh3);display:flex;flex-direction:column;pointer-events:auto;transform-origin:50% 0;overflow:hidden;will-change:transform;
  transition:transform .5s cubic-bezier(.2,.9,.28,1.06)}
.deck[data-mode="min"] .dcard{transition:transform .38s cubic-bezier(.45,0,.2,1);pointer-events:none}
.dcard>.dhead,.dcard>.dlist{transition:opacity .2s ease}
.dcard:not(.front)>*{pointer-events:none}
.dcard:not(.front){cursor:pointer;background:var(--panel)}
.dcard:not(.front)>.dlist,.dcard:not(.front) .dctl{opacity:0}
.dhead{display:flex;align-items:center;gap:10px;padding:0 10px 0 22px;height:52px;flex:none;touch-action:none;user-select:none}
.dcard.front .dhead{cursor:grab}
.dhead h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.dcount{font-size:13px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.dctl{margin-left:auto;display:flex;gap:2px}
.dlist{flex:1;min-height:0;overflow-y:auto;padding:0 12px 24px}
.dg{margin-top:6px}
.dg+.dg{margin-top:16px}
.dg-label{display:flex;gap:8px;padding:0 10px 4px;font-size:12px;font-weight:700;color:var(--mute)}
.dg-label span{color:var(--faint);font-weight:600}
.dl{display:flex;flex-direction:column;min-height:6px}
.drow{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:9px;cursor:grab;user-select:none;-webkit-user-select:none;--tb:var(--hover)}
.drow:hover,body.kbd .drow.sel{background:var(--hover)}
.drow:hover>.tools,body.kbd .drow.sel>.tools{opacity:1;pointer-events:auto}
.drow:hover>.marks,body.kbd .drow.sel>.marks{opacity:0}
body.kbd .drow.sel{box-shadow:0 0 0 1.5px var(--ring)}
.drow.m1 .t-title{padding-right:20px}
.dr-main{flex:1;min-width:0}
.dr-ini{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dempty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:170px;margin:8px 4px;padding:20px;border:1px dashed var(--line2);border-radius:14px;color:var(--mute);font-size:13px;line-height:1.55}
.dhint{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:11px;background:var(--btn);color:var(--btn-ink);font-size:13px;font-weight:600;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;pointer-events:none}
body.drag-out .dcard[data-card="daily"] .dhint{opacity:1;transform:none}
body.drag-out .dnd-fallback{opacity:.45!important}
.resizer{position:absolute;left:-8px;top:76px;bottom:0;width:12px;cursor:col-resize;pointer-events:auto;z-index:20;display:flex;justify-content:center}
.resizer::after{content:"";width:3px;height:44px;border-radius:2px;background:var(--line2);align-self:center;opacity:0;transition:opacity .15s}
.resizer:hover::after,.resizing .resizer::after{opacity:1}
.deck[data-mode="min"] .resizer{display:none}
.resizing,.resizing *{cursor:col-resize!important;user-select:none}
.resizing .dcard{transition:none}

/* Scratchpad card */
.dcard[data-card="notes"] .dlist{display:flex;padding:0;overflow:hidden}
.notes{flex:1;width:100%;border:0;outline:none;resize:none;background:transparent;padding:2px 22px 24px;font:14px/1.65 var(--font);color:var(--ink)}
.notes::placeholder{color:var(--faint)}

/* Weekly card: objectives */
.obj{border-radius:12px;position:relative}
.obj.open{background:var(--card);box-shadow:0 0 0 1px var(--line);margin:6px 0}
body.kbd .obj.sel{box-shadow:0 0 0 1.5px var(--ring)}
.obj-row{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 10px 4px;border-radius:12px;cursor:pointer;position:relative}
.obj:not(.open) .obj-row:hover{background:var(--hover)}
.obj-row .chev{height:20px}
.onum{font-size:12.5px;font-weight:700;color:var(--faint);margin-top:1px;flex:none;width:10px}
.obj-title{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.4;outline:none;border-radius:4px;word-break:break-word}
.obj:not(.open) .obj-title:not(.editing){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sdot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.sdot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--on)}
.sdot.s-risk::after{background:var(--risk)}
.sdot.s-off::after{background:var(--off)}
.sdot:hover{background:var(--hover)}
.oprog{font-size:12px;color:var(--mute);min-width:24px;text-align:right;margin-top:1px;font-variant-numeric:tabular-nums}
.obj-drop{position:absolute;inset:0;display:none;border-radius:12px;z-index:2}
body.drag-task .obj-drop{display:block}
body.drag-task .obj-row{box-shadow:inset 0 0 0 1px var(--line2)}
.obj-drop .dnd-ghost{display:none}
.obj-body{padding:0 8px 6px 40px}
.obj-tasks{display:flex;flex-direction:column;min-height:4px}
.otask{position:relative;display:flex;align-items:flex-start;gap:9px;padding:6px 8px;border-radius:8px;--tb:var(--hover)}
.otask:hover,body.kbd .otask.sel{background:var(--hover)}
.otask:hover .tools,body.kbd .otask.sel .tools{opacity:1;pointer-events:auto}
body.kbd .otask.sel{box-shadow:0 0 0 1.5px var(--ring)}
.otask .check{width:15px;height:15px;margin-top:2px}
.ot-main{flex:1;min-width:0}
.ot-title{font-size:13px;line-height:1.38;outline:none;cursor:text;border-radius:4px;word-break:break-word}
.ot-ini{font-size:11.5px;color:var(--mute)}
.otask.done .ot-title{text-decoration:line-through;color:var(--mute)}
.obj-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.qlink{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px;font-size:12.5px;color:var(--mute);font-weight:500}
.qlink .i{width:13px;height:13px}
.qlink:hover{background:var(--hover);color:var(--ink)}
.add-obj{margin:8px 0 0 6px}
.obj-empty{padding:4px 10px 6px;font-size:13px;color:var(--mute);line-height:1.5}
.over-note{display:flex;align-items:center;gap:8px;margin:4px 8px 8px;font-size:12.5px;color:var(--mute)}
.over-note button{font-weight:600;color:var(--ink)}

/* Minimised planner */
.spine{position:fixed;right:0;top:100px;bottom:14px;width:44px;z-index:39;background:var(--raise);border:1px solid var(--line);border-right:0;border-radius:16px 0 0 16px;box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .2s}
.spine:hover{transform:translateX(-4px);background:var(--panel)}
.spine.hide{transform:translateX(110%);pointer-events:none}
.sp-l{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:700;color:var(--ink2)}
.sp-n{font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.sp-dots{display:flex;flex-direction:column;gap:7px}
.sp-dots i{width:8px;height:8px;border-radius:50%;background:var(--on)}
.sp-dots i.s-risk{background:var(--risk)}
.sp-dots i.s-off{background:var(--off)}
.spine-drop{position:absolute;inset:0;border-radius:inherit}
.spine-drop .dnd-ghost{display:none}
body.drag-task .spine{background:var(--hover);transform:translateX(-6px)}

/* Drag and drop */
.dnd-ghost{background:var(--hover)!important;border-color:transparent!important;box-shadow:none!important}
.dnd-ghost>*{opacity:0}
.dnd-fallback{opacity:1!important;rotate:1.5deg;box-shadow:var(--sh3)!important}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}

/* Popovers */
.pop{position:fixed;z-index:100;min-width:240px;max-width:360px;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh3);padding:6px;opacity:0;transform:translateY(-4px) scale(.98);transition:opacity .14s,transform .14s;transform-origin:top left}
.pop.in{opacity:1;transform:none}
.pop.wide{width:390px;max-width:calc(100vw - 20px)}
.pop-h{display:flex;align-items:baseline;gap:8px;padding:6px 8px 4px;font-size:13px;font-weight:700;min-width:0}
.pop-h span{font-weight:500;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pop-sub{padding:0 8px 6px;font-size:12.5px;color:var(--mute);line-height:1.45}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:13px;min-height:34px}
.mi:hover,.mi.hi{background:var(--bg)}
.mi.cur{font-weight:700}
.mi.cur::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink2);margin-left:auto;flex:none}
.mi .i{color:var(--mute)}
.mi kbd{flex:none}
.mi .sk{margin-left:auto;color:var(--faint);font-size:11.5px;font-weight:600;flex:none}
.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt small{display:block;font-size:11.5px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.mh{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--on)}
.mdot.s-risk{background:var(--risk)}.mdot.s-off{background:var(--off)}
.msep{height:1px;background:var(--line);margin:4px 6px}
.pop-f{padding:7px 8px 3px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);margin-top:4px}
.pin{width:100%;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 10px;outline:none;font-size:13px}
.pin:focus{border-color:var(--ring)}
.pop-pad{padding:2px 4px}
.pop-row{display:flex;align-items:center;gap:6px;padding:8px 4px 2px}
.pop-hint{margin-left:auto;font-size:11.5px;color:var(--faint)}
.btn-s{height:28px;padding:0 10px;border-radius:7px;background:var(--bg);font-size:12.5px;font-weight:700}
.btn-s:hover{background:var(--line)}
.tl{display:flex;flex-direction:column;gap:2px;padding:2px 2px 6px;max-height:280px;overflow:auto}
.tl-row,.tl-add{display:flex;align-items:center;gap:6px}
.tl-row{padding:2px}
.tl-row .check{width:16px;height:16px}
.tl-d{height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:0 6px;font-size:12.5px;width:136px;flex:none;outline:none}
.tl-d:focus{border-color:var(--ring)}
.tl-l{flex:1;min-width:0;height:30px;border-radius:7px;border:1px solid transparent;background:none;padding:0 8px;font-size:13px;outline:none}
.tl-l:hover{border-color:var(--line)}
.tl-l:focus{border-color:var(--ring);background:var(--card)}
.tl-row.done .tl-l{text-decoration:line-through;color:var(--mute)}
.tl-row .ic{opacity:.6}
.tl-add{border-top:1px solid var(--line);padding:8px 2px 2px}
.tl-add .tl-l{border-color:var(--line);background:var(--card)}
.tl-empty{padding:6px 8px 10px;font-size:12.5px;color:var(--mute);line-height:1.45}
.lt{max-height:300px;overflow:auto;margin-top:6px}
.lt .mt{white-space:normal}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,26,.3);z-index:200;display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .18s}
.modal-bg.in{opacity:1}
.modal{width:min(680px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--raise);border-radius:18px;box-shadow:var(--sh3);padding:20px 24px 24px;transform:translateY(8px) scale(.985);transition:transform .2s}
.modal.small{width:min(420px,100%)}
.modal-bg.in .modal{transform:none}
.mh-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.mh-row h2{flex:1;margin:0;font-size:20px;letter-spacing:-.02em}
.modal h3{margin:22px 0 6px;font-size:14px;display:flex;align-items:baseline;gap:10px}
.modal h3 small{font-weight:500;color:var(--mute);font-size:12.5px}
.note{margin:0 0 10px;font-size:12.5px;color:var(--mute);line-height:1.5}
.field{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.field label{flex:1;font-size:13.5px;font-weight:500}
.field label small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.inp{height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 10px;font-size:13px;outline:none;min-width:0}
.inp:focus{border-color:var(--ring)}
.inp.num{width:76px}
select.inp{padding:0 6px}
.rowed{display:flex;align-items:center;gap:6px;padding:4px 0}
.rowed .g1{flex:1}
.rowed .g2{flex:1.7}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;background:var(--bg);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{opacity:.9}
.btn.sm{height:28px;font-size:12.5px;margin-top:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow.end{justify-content:flex-end}
.syncbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--bg);font-size:13px;margin-bottom:6px}
.syncbox i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.syncbox.on i{background:var(--on)}
.syncbox.warn i{background:var(--risk)}
.syncbox .sp{flex:1}
.confirm-msg{margin:4px 0 14px;font-size:14px;line-height:1.5}
.ta{width:100%;height:220px;border-radius:10px;border:1px solid var(--line2);background:var(--card);padding:10px 12px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;resize:vertical}
.ta:focus{border-color:var(--ring)}
.err{color:var(--ink2);font-size:12.5px;margin-top:6px;min-height:18px}
.smodal{width:min(860px,100%);height:min(640px,calc(100vh - 48px));padding:0;display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden}
.snav{background:var(--panel);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px}
.snav h2{margin:0 0 12px 10px;font-size:17px;letter-spacing:-.02em}
.snav button{display:flex;align-items:center;height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink2);text-align:left}
.snav button:hover{background:var(--hover)}
.snav button.cur{background:var(--hover);color:var(--ink);font-weight:700}
.spane{overflow-y:auto;padding:22px 28px 28px;position:relative}
.spane-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.spane-h div{flex:1}
.spane-h h3{margin:0;font-size:18px;letter-spacing:-.015em}
.spane-h p{margin:4px 0 0;font-size:13px;color:var(--mute);line-height:1.5}
.sgroup{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:22px}
.sgroup-h{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 8px 2px}
.sgroup-h small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;margin-top:2px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:54px}
.srow+.srow{border-top:1px solid var(--line)}
.srow label{flex:1;font-size:13.5px;font-weight:500}
.srow label small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:1px}
.srow.list{gap:6px;padding:8px 10px 8px 12px;min-height:0}
.srow.list .g1{flex:1}
.srow.list .g2{flex:1.7}
.srow.add{padding:6px 8px;min-height:0}
.srow .btnrow{margin-top:0}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.kgroup h4{margin:16px 0 4px;font-size:13px}
.krow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.krow span:last-child{display:flex;gap:3px;flex:none;align-items:center;color:var(--faint);font-size:11.5px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 14px;border-radius:11px;background:var(--toast);color:#F1F2F4;font-size:13px;box-shadow:var(--sh3);animation:tin .22s cubic-bezier(.2,.8,.2,1);max-width:min(560px,calc(100vw - 32px))}
.toast button{color:#FFFFFF;font-weight:700;font-size:12.5px;padding:3px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:2px}
.toast button:hover{background:rgba(255,255,255,.1)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.shake{animation:shake .34s}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}

@media (max-width:760px){.smodal{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.snav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.snav h2{display:none}.snav button{flex:none}.brand{display:none}.tb-search{margin-left:0;min-width:0;flex:1}.tb-search kbd,#tb-keys{display:none}.tb-btn kbd{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" id="tb-name">Spacebar</div>
    <label class="tb-search"><span id="tb-search-ic"></span><input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search tasks and initiatives"><kbd>/</kbd></label>
    <div class="tb-sp"></div>
    <button class="tb-warn" id="tb-warn" data-act="sync" hidden></button>
    <button class="icb" id="tb-prio" data-act="prioFilter"></button>
    <button class="tb-btn" id="tb-plan" data-act="togglePlan" data-tip="Open the Planner. Space cycles Daily, Weekly, Scratchpad and closed">Planner<kbd>Space</kbd></button>
    <button class="icb" id="tb-keys" data-act="shortcuts" data-tip="Keyboard shortcuts ( ? )"></button>
    <button class="icb" id="tb-gear" data-act="settings" data-tip="Settings"></button>
  </header>
  <section class="board" id="board" aria-label="Initiatives board"></section>
</div>
<div class="scrim" id="scrim"></div>
<div class="deck" id="deck" data-mode="min"><div class="resizer" id="resizer" data-tip="Drag to resize"></div></div>
<div class="spine" id="spine" data-act="openPlan" role="button" tabindex="0" data-tip="Planner (Space)"><span class="sp-n" id="sp-n"></span><span class="sp-l">Planner</span><span class="sp-dots" id="sp-dots"></span><div class="spine-drop" data-zone="daily"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= Utilities ================= */
const LS_DATA = 'spacebar.data.v1', LS_UI = 'spacebar.ui.v1', LS_OLD = 'throughline.data.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((pd(a) - pd(b)) / 864e5);
const mondayOf = s => addDays(s, -((pd(s).getDay() + 6) % 7));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDM = s => { const d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtWDM = s => { const d = pd(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const parseJSON = s => { try { return JSON.parse(s); } catch (e) { return null; } };
const clampInt = (v, lo, hi, def) => { v = parseInt(v, 10); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def; };
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};

/* ================= Icons ================= */

/* Accepts anything that looks like workspace data (including hand or Claude edits) and repairs it. */
function normalize(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Workspace data must be a JSON object');
  const d = emptyData();
  const arr = x => Array.isArray(x) ? x.filter(v => v && typeof v === 'object') : [];
  const str = (v, def = '') => typeof v === 'string' ? v : (v == null ? def : String(v));
  const idf = (set, v, p) => { let id = str(v).trim() || uid(p); while (set.has(id)) id = uid(p); set.add(id); return id; };
  const st = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
  let name = str(st.name).trim().slice(0, 60);
  if (!name || name === 'Throughline') name = 'Spacebar';
  d.settings = {
    name,
    priorityCap: clampInt(st.priorityCap, 1, 50, 5),
    dailyCap: clampInt(st.dailyCap != null ? st.dailyCap : st.focusCap, 1, 50, 10),
    objectiveCap: clampInt(st.objectiveCap, 1, 10, 3),
    cycleDays: clampInt(st.cycleDays, 1, 120, 7),
    cycleStart: isYmd(st.cycleStart) ? st.cycleStart : mondayOf(today()),
    theme: ['system', 'light', 'dark'].includes(st.theme) ? st.theme : 'system'
  };
  d.updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : d.updatedAt;
  d.sample = raw.sample === true;
  const sIds = new Set();
  const stages = arr(raw.stages).map(s => { const id = idf(sIds, s.id, 's'); return { id, name: str(s.name).trim() || id, hint: str(s.hint) }; });
  if (stages.length) d.stages = stages;
  if (Array.isArray(raw.modes)) {
    const mIds = new Set();
    d.modes = arr(raw.modes).map(m => { const id = idf(mIds, m.id, 'm'); return { id, name: str(m.name).trim() || id, hint: str(m.hint) }; });
  }
  const oIds = new Set();
  d.objectives = arr(raw.objectives).map(o => ({ id: idf(oIds, o.id, 'o'), title: str(o.title), status: STATUS[o.status] ? o.status : 'on' }));
  const stageIds = new Set(d.stages.map(s => s.id));
  const iIds = new Set();
  d.initiatives = arr(raw.initiatives).map(i => {
    const msIds = new Set();
    return {
      id: idf(iIds, i.id, 'i'), name: str(i.name), stage: stageIds.has(str(i.stage)) ? str(i.stage) : d.stages[0].id,
      priority: i.priority === true, link: str(i.link).trim(),
      milestones: arr(i.milestones).map(m => ({ id: idf(msIds, m.id, 'ms'), date: isYmd(m.date) ? m.date : '', label: str(m.label), done: m.done === true }))
    };
  });
  const modeIds = new Set(d.modes.map(m => m.id));
  const tIds = new Set();
  let unfiled = null;
  d.tasks = arr(raw.tasks).map(t => {
    let ini = str(t.ini);
    if (!iIds.has(ini)) {
      if (!unfiled) { unfiled = { id: idf(iIds, 'unfiled', 'i'), name: 'Unfiled', stage: d.stages[0].id, priority: false, link: '', milestones: [] }; d.initiatives.push(unfiled); }
      ini = unfiled.id;
    }
    const done = t.done === true;
    return {
      id: idf(tIds, t.id, 't'), title: str(t.title), ini,
      mode: modeIds.has(str(t.mode)) ? str(t.mode) : null,
      obj: oIds.has(str(t.obj)) ? str(t.obj) : null,
      link: str(t.link).trim(), done, doneAt: done ? (isYmd(t.doneAt) ? t.doneAt : today()) : null
    };
  });
  const open = new Set(d.tasks.filter(t => !t.done).map(t => t.id));
  const src = Array.isArray(raw.daily) ? raw.daily : Array.isArray(raw.focus) ? raw.focus : arr(raw.tasks).filter(t => t.daily === true || t.focus === true).map(t => t.id);
  d.daily = [...new Set(src.map(String))].filter(id => open.has(id));
  d.notes = str(raw.notes).slice(0, 200000);
  return d;
}

function pushHist(snap) { if (!snap) return; hist.past.push(snap); if (hist.past.length > 100) hist.past.shift(); hist.future = []; }
function touch() { S.updatedAt = new Date().toISOString(); persist(); }
let warnedStorage = false;
function persistLocal() { if (!store.set(LS_DATA, JSON.stringify(S)) && !warnedStorage) { warnedStorage = true; toast('This browser is blocking storage, so changes will not survive a reload. Link a data file in Settings.'); } }
function persist() { persistLocal(); scheduleFileWrite(); }
function commit(fn, opts = {}) {
  const before = snapshot();
  if (fn() === false) return false;
  pushHist(before); touch(); render(opts);
  return true;
}
function undo() {
  if (!hist.past.length) { toast('Nothing to undo'); return; }
  hist.future.push(snapshot()); const nt = S.notes; S = normalize(JSON.parse(hist.past.pop())); S.notes = nt; touch(); render(); toast('Undone');
}
function redo() {
  if (!hist.future.length) { toast('Nothing to redo'); return; }
  hist.past.push(snapshot()); const nt = S.notes; S = normalize(JSON.parse(hist.future.pop())); S.notes = nt; touch(); render(); toast('Redone');
}

/* ================= Derived ================= */
const q = () => query.trim().toLowerCase();
function taskMatches(t) {
  const s = q(); if (!s || !t.title) return true;
  return t.title.toLowerCase().includes(s) || ((getIni(t.ini) || {}).name || '').toLowerCase().includes(s);
}
function iniVisible(i) {
  if (UI.priorityOnly && !i.priority) return false;
  const s = q(); if (!s) return true;
  return i.name.toLowerCase().includes(s) || S.tasks.some(t => t.ini === i.id && !t.done && t.title.toLowerCase().includes(s));
}
function isFolded(i) {
  if (q()) return false;
  return Object.prototype.hasOwnProperty.call(UI.fold, i.id) ? !!UI.fold[i.id] : !i.priority;
}
function setFold(id, v) { UI.fold[id] = v; saveUI(); }
function orderedOpen() {
  const rank = new Map(S.initiatives.map((i, k) => [i.id, k]));
  return S.tasks.map((t, k) => [t, k]).filter(([t]) => !t.done).sort((a, b) => (rank.get(a[0].ini) - rank.get(b[0].ini)) || (a[1] - b[1])).map(x => x[0]);
}
function nextMs(i) { return (i.milestones || []).filter(m => !m.done && isYmd(m.date)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)[0] || null; }
function msWhen(m) {
  const n = diffDays(m.date, today());
  if (n < 0) return 'Overdue ' + (-n) + 'd';
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 7) return WD[pd(m.date).getDay()];
  return fmtDM(m.date);
}
function cycle() {
  const len = S.settings.cycleDays, start = S.settings.cycleStart, end = addDays(start, len - 1), t = today();
  return { len, start, end, day: diffDays(t, start) + 1, left: diffDays(end, t) };
}
const cycleLabel = () => ({ 7: 'Weekly', 14: 'Fortnightly', 28: 'Monthly' }[S.settings.cycleDays] || 'Cycle');
const selCls = (k, id, z) => sel && sel.kind === k && sel.id === id && sel.z === z ? ' sel' : '';

function render(o = {}) {
  if (editing) { renderPending = true; return; }
  renderPending = false;
  const flip = o.flip !== false && !firstRender && !reduceMotion && !dragging;
  const before = flip ? measure() : null;
  const sc = {}; $$('[data-scroll-key]').forEach(el => { sc[el.dataset.scrollKey] = el.scrollTop; });
  applyTheme();
  renderTopbar(); renderBoard(); renderPlanner();
  $$('[data-scroll-key]').forEach(el => { if (sc[el.dataset.scrollKey] != null) el.scrollTop = sc[el.dataset.scrollKey]; });
  if (sel && !selEl()) { sel = selFallback; const e = sel && selEl(); if (e) e.classList.add('sel'); else sel = null; }
  selFallback = null;
  applyPlan(planStagger); planStagger = false;
  if (before) playFlip(before);
  initSortables();
  firstRender = false;
}
function measure() { const m = new Map(); $$('[data-key]').forEach(el => { const r = el.getBoundingClientRect(); if (r.width) m.set(el.dataset.key, r); }); return m; }
function playFlip(before) {
  const deltas = new Map();
  $$('[data-key]').forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const b = before.get(el.dataset.key);
    const par = el.parentElement && el.parentElement.closest('[data-key]');
    const pdlt = (par && deltas.get(par)) || [0, 0];
    if (!b) { deltas.set(el, [0, 0]); if (!par || before.has(par.dataset.key)) el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'ease-out' }); return; }
    const dx = b.left - r.left, dy = b.top - r.top;
    deltas.set(el, [dx, dy]);
    const rx = dx - pdlt[0], ry = dy - pdlt[1];
    if (Math.abs(rx) > 1 || Math.abs(ry) > 1) el.animate([{ transform: `translate(${rx}px,${ry}px)` }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}
function applyTheme() {
  const th = S.settings.theme;
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
}
function renderTopbar() {
  $('#tb-name').textContent = S.settings.name;
  document.title = S.settings.name;
  const pb = $('#tb-prio');
  pb.innerHTML = I.star; pb.classList.toggle('on', UI.priorityOnly);
  pb.dataset.tip = UI.priorityOnly ? 'Showing priority initiatives only. Click to show all' : `Show priority initiatives only (${prioCount()} of ${S.settings.priorityCap})`;

    res = orderedOpen().filter(t => t.obj !== objId && (!s || t.title.toLowerCase().includes(s) || ((getIni(t.ini) || {}).name || '').toLowerCase().includes(s))).slice(0, 12);
    hi = Math.min(hi, Math.max(0, res.length - 1));
    list.innerHTML = res.length ? res.map((t, k) => `<button class="mi${k === hi ? ' hi' : ''}" data-ix="${k}"><span class="mt">${esc(t.title)}<small>${esc((getIni(t.ini) || {}).name || '')}${t.obj ? `, now on objective ${objNum(t.obj)}` : ''}</small></span></button>`).join('') : '<div class="pop-sub">No matching open tasks.</div>';
  };

  document.body.appendChild(bg);

}

/* ================= File sync (lets Claude edit the workspace) ================= */
const FS_OK = 'showSaveFilePicker' in window && 'indexedDB' in window;

}

}

    sync.lastMod = f.lastModified;
    const strip = x => JSON.stringify(Object.assign({}, x, { updatedAt: '' }));
    if (strip(d) === strip(S)) return;

}
function applyExternal(d) {

}
setInterval(() => { if (pendingExternal && !editing && !dragging && !pop && !modals.length && document.activeElement !== notesEl) applyExternal(pendingExternal); }, 800);

let gPending = false, gTimer = null;
